<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Kinetic Audit | LiveAdaptiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Inter"', 'sans-serif'] },
                    colors: { 
                        slate: { 50: '#f8fafc', 800: '#1e293b', 900: '#0f172a', 950: '#020617' },
                        teal: { 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488' },
                        rose: { 500: '#f43f5e', 600: '#e11d48' },
                        amber: { 400: '#fbbf24', 500: '#f59e0b' }
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .slide-left { animation: slideLeft 0.4s ease-out forwards; }
        @keyframes slideLeft { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        /* Custom Radio Buttons */
        input[type="radio"] { appearance: none; width: 20px; height: 20px; border: 2px solid #475569; border-radius: 50%; outline: none; transition: all 0.2s; cursor: pointer; }
        input[type="radio"]:checked { border-color: #14b8a6; border-width: 6px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-50 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <nav class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i data-lucide="activity" class="w-5 h-5 text-teal-500"></i>
                <span class="font-bold text-white tracking-wide uppercase text-sm">LiveAdaptiv</span>
            </div>
            <div class="text-[10px] uppercase tracking-widest font-bold text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-teal-500 animate-pulse"></span> Diagnostic Active
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-6 py-12 flex-grow w-full relative">
        
        <!-- Intro Screen -->
        <div id="intro-screen" class="text-center fade-in">
            <div class="w-16 h-16 bg-slate-900 border border-slate-700 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-[0_0_30px_rgba(20,184,166,0.15)]">
                <i data-lucide="cpu" class="w-8 h-8 text-teal-400"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-4 tracking-tight">The Kinetic Audit</h1>
            <p class="text-slate-400 text-base mb-8 max-w-lg mx-auto leading-relaxed">
                This is a clinical diagnostic tool to measure your current autonomic debt and burnout severity. Answer instinctively. Do not overthink.
            </p>
            <button onclick="startAudit()" class="w-full sm:w-auto px-8 py-4 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl text-sm uppercase tracking-widest transition-all shadow-lg hover:shadow-teal-500/25 flex items-center justify-center gap-2 mx-auto">
                Begin Diagnostic <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Question Screen -->
        <div id="question-screen" class="hidden">
            <div class="mb-8">
                <div class="flex justify-between text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">
                    <span id="question-counter">Question 1 of 10</span>
                    <span id="progress-percent" class="text-teal-500">10%</span>
                </div>
                <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-teal-500 transition-all duration-300 w-[10%]"></div>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 right-0 p-24 bg-teal-500/5 rounded-full blur-3xl pointer-events-none"></div>
                
                <h2 id="question-text" class="text-xl md:text-2xl font-semibold text-white mb-8 relative z-10 leading-snug">
                    Question text goes here
                </h2>

                <div id="options-container" class="space-y-3 relative z-10">
                    <!-- Options injected via JS -->
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden">
            <!-- Content injected via JS based on score -->
        </div>

    </main>

    <footer class="text-center pb-8 border-t border-slate-800/50 mt-auto">
        <p class="mt-6 text-[10px] text-slate-500 uppercase tracking-widest font-bold">© 2026 LiveAdaptiv Systems</p>
    </footer>

    <script>
        lucide.createIcons();

        // Audit Data
        const questions = [
            { text: "When I wake up, my first thought regarding the day ahead is usually:", options: [ { text: "Energized or neutral.", value: 0 }, { text: "Mildly annoyed but manageable.", value: 1 }, { text: "A heavy sense of dread or exhaustion.", value: 2 }, { text: "Complete apathy; I am emotionally numb.", value: 3 } ] },
            { text: "When a minor inconvenience occurs (e.g., an email, a dropped pen, a small delay):", options: [ { text: "I handle it easily.", value: 0 }, { text: "I get briefly frustrated.", value: 1 }, { text: "I feel a disproportionate spike of rage/panic.", value: 2 }, { text: "I feel nothing. I am too tired to care.", value: 3 } ] },
            { text: "Regarding my empathy toward clients, patients, or team members:", options: [ { text: "I remain compassionate and engaged.", value: 0 }, { text: "I have to fake it occasionally.", value: 1 }, { text: "I view them as obstacles or burdens.", value: 2 }, { text: "I feel profound cynicism and detachment.", value: 3 } ] },
            { text: "My sleep architecture right now is:", options: [ { text: "Solid. I wake up rested.", value: 0 }, { text: "Inconsistent, but I survive.", value: 1 }, { text: "I can't fall asleep because my mind races.", value: 2 }, { text: "I sleep, but wake up completely exhausted.", value: 3 } ] },
            { text: "When I am not working, my brain is:", options: [ { text: "Present and engaged in my life.", value: 0 }, { text: "Thinking about work occasionally.", value: 1 }, { text: "Constantly looping over worst-case scenarios.", value: 2 }, { text: "Completely checked out / doomscrolling for hours.", value: 3 } ] },
            { text: "Physically, my body feels:", options: [ { text: "Healthy and regulated.", value: 0 }, { text: "A bit tense, maybe minor headaches.", value: 1 }, { text: "Chronically tight (jaw, shoulders, chest).", value: 2 }, { text: "Heavy, exhausted, or experiencing chronic pain.", value: 3 } ] },
            { text: "If my supervisor/system asked me to take on one more task right now:", options: [ { text: "I could handle it.", value: 0 }, { text: "I'd do it, but I'd be resentful.", value: 1 }, { text: "I would panic or snap at them.", value: 2 }, { text: "I would mentally or physically collapse.", value: 3 } ] },
            { text: "My reliance on substances (caffeine, alcohol, sugar) to change my state is:", options: [ { text: "Minimal or zero.", value: 0 }, { text: "Normal/Average.", value: 1 }, { text: "Increasing. I need them to function/relax.", value: 2 }, { text: "Absolute. I am dependent on them to regulate.", value: 3 } ] },
            { text: "When I think about my professional future:", options: [ { text: "I see growth and opportunity.", value: 0 }, { text: "I'm just trying to get through the week.", value: 1 }, { text: "I want to escape but feel trapped.", value: 2 }, { text: "I believe my career/industry has ruined me.", value: 3 } ] },
            { text: "Which statement best describes your current state?", options: [ { text: "I am managing my friction well.", value: 0 }, { text: "I am stressed, but still fighting.", value: 1 }, { text: "I am surviving on pure adrenaline.", value: 2 }, { text: "I am running on empty. I am broken.", value: 3 } ] }
        ];

        let currentQuestion = 0;
        let totalScore = 0;

        function startAudit() {
            document.getElementById('intro-screen').classList.add('hidden');
            const qScreen = document.getElementById('question-screen');
            qScreen.classList.remove('hidden');
            qScreen.classList.add('fade-in');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('question-counter').innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
            
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-percent').innerText = `${Math.round(progress)}%`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            container.classList.remove('slide-left');
            void container.offsetWidth; 
            container.classList.add('slide-left');

            q.options.forEach((opt, index) => {
                const label = document.createElement('label');
                label.className = "flex items-center gap-4 p-4 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-800 cursor-pointer transition-colors group";
                label.innerHTML = `
                    <input type="radio" name="q" value="${opt.value}" onclick="handleSelection(${opt.value})">
                    <span class="text-slate-300 group-hover:text-white transition-colors text-sm md:text-base leading-snug">${opt.text}</span>
                `;
                container.appendChild(label);
            });
        }

        function handleSelection(value) {
            totalScore += value;
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    renderQuestion();
                } else {
                    showResults();
                }
            }, 300);
        }

        function showResults() {
            document.getElementById('question-screen').classList.add('hidden');
            const rScreen = document.getElementById('results-screen');
            rScreen.classList.remove('hidden');
            rScreen.classList.add('fade-in');

            let uiConfig = {};

            // -------------------------------------------------------------
            // THE NEW INVERTED 3-TIER ROUTING LOGIC
            // -------------------------------------------------------------

            if (totalScore <= 10) {
                // TIER 1: LOW FRICTION (Score 0-10) -> $97 The Alchemist Field Guide
                // Rationale: High cognitive bandwidth. Ready for optimization and mastery.
                uiConfig = {
                    title: "High Cognitive Bandwidth",
                    color: "text-teal-500",
                    bgTheme: "bg-teal-500/10 border-teal-500/30",
                    icon: `<i data-lucide="shield-check" class="w-10 h-10 text-teal-500"></i>`,
                    desc: "Your nervous system is currently regulated. You have the cognitive bandwidth required to build indestructible enterprise architecture. Now is the time to fortify your boundaries before the environment degrades your reserves.",
                    productName: "The Alchemist Field Guide (Master Edition)",
                    productPrice: "$97",
                    // PASTE YOUR $97 LEMON SQUEEZY LINK HERE:
                    checkoutLink: "https://app.lemonsqueezy.com/share/863473"
                };
            } 
            else if (totalScore <= 20) {
                // TIER 2: MODERATE FRICTION (Score 11-20) -> $47 Stress Transformation
                // Rationale: Operating in Sympathetic overdrive. Needs structural metabolic tools.
                uiConfig = {
                    title: "Moderate Autonomic Debt (Sympathetic Response)",
                    color: "text-amber-500",
                    bgTheme: "bg-amber-500/10 border-amber-500/30",
                    icon: `<i data-lucide="alert-triangle" class="w-10 h-10 text-amber-500"></i>`,
                    desc: "You are operating in a chronic state of 'Fight or Flight.' Your amygdala is actively dumping cortisol, resulting in high anxiety, disrupted sleep, and reactivity. You need structural tools to metabolize this stress before you enter collapse.",
                    productName: "Stress Transformation Protocol",
                    productPrice: "$47",
                    // PASTE YOUR $47 LEMON SQUEEZY LINK HERE:
                    checkoutLink: "https://app.lemonsqueezy.com/share/864312"
                };
            } 
            else {
                // TIER 3: HIGH FRICTION (Score 21-30) -> $27 Burnout Rescue
                // Rationale: Dorsal Vagal Shutdown. Low bandwidth. Needs immediate, low-barrier lifeline.
                uiConfig = {
                    title: "Critical Burnout (Dorsal Vagal Shutdown)",
                    color: "text-rose-500",
                    bgTheme: "bg-rose-500/10 border-rose-500/30",
                    icon: `<i data-lucide="siren" class="w-10 h-10 text-rose-500"></i>`,
                    desc: "Diagnostic Critical. You are exhibiting signs of severe Autonomic Collapse. You do not have the bandwidth for a complex masterclass right now. You need an immediate, frictionless lifeline to stop the psychological bleed.",
                    productName: "The Burnout Rescue Workbook",
                    productPrice: "$27",
                    // PASTE YOUR $27 LEMON SQUEEZY LINK HERE:
                    checkoutLink: "https://app.lemonsqueezy.com/share/864269"
                };
            }

            // Render the Dynamic Results UI
            rScreen.innerHTML = `
                <div class="text-center mb-8">
                    <h2 class="text-slate-400 uppercase tracking-widest font-bold text-xs mb-2">Diagnostic Complete</h2>
                    <div class="text-6xl font-black ${uiConfig.color} mb-2 font-mono">${totalScore}<span class="text-2xl text-slate-600">/30</span></div>
                    <p class="text-sm text-slate-500">Burnout Severity Score</p>
                </div>

                <div class="${uiConfig.bgTheme} border rounded-2xl p-6 md:p-8 mb-8 relative overflow-hidden">
                    <div class="flex items-center gap-4 mb-4">
                        ${uiConfig.icon}
                        <h3 class="text-xl md:text-2xl font-bold text-white">${uiConfig.title}</h3>
                    </div>
                    <p class="text-slate-300 leading-relaxed text-sm md:text-base">
                        ${uiConfig.desc}
                    </p>
                </div>

                <div class="bg-slate-900 border border-slate-700 p-8 rounded-2xl text-center shadow-2xl relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900 to-transparent z-0"></div>
                    <div class="relative z-10">
                        <p class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Prescribed Treatment Architecture</p>
                        <h4 class="text-2xl font-bold text-white mb-4">${uiConfig.productName}</h4>
                        <a href="${uiConfig.checkoutLink}" target="_blank" class="inline-flex items-center justify-center gap-2 w-full sm:w-auto px-8 py-4 bg-white text-slate-950 font-bold rounded-xl text-sm uppercase tracking-widest transition-all hover:scale-105 hover:bg-slate-200">
                            Unlock Protocol (${uiConfig.productPrice}) <i data-lucide="lock" class="w-4 h-4"></i>
                        </a>
                        <p class="mt-4 text-[10px] text-slate-500 uppercase tracking-widest">Enterprise Encrypted Delivery</p>
                    </div>
                </div>
                
                <div class="mt-8 text-center">
                    <a href="index.html" class="text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-white transition-colors">Return to LiveAdaptiv Hub</a>
                </div>
            `;
            
            lucide.createIcons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
