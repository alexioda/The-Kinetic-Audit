<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kinetic Audit | LiveAdaptiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #b2945e; --stone: #fafaf9; --charcoal: #1c1917; }
        body { background-color: var(--stone); color: var(--charcoal); font-family: 'Inter', sans-serif; overscroll-behavior: none; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .blueprint-dot { background-image: radial-gradient(circle at 1px 1px, #e7e5e4 1px, transparent 0); background-size: 30px 30px; }
        
        .fade-in { animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-in-right { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideInRight { 0% { opacity: 0; transform: translateX(20px); } 100% { opacity: 1; transform: translateX(0); } }

        .option-btn { transition: all 0.2s ease; border: 1px solid #e7e5e4; }
        .option-btn:hover { border-color: var(--gold); background-color: rgba(178, 148, 94, 0.05); }
        .option-btn.selected { border-color: var(--gold); background-color: rgba(178, 148, 94, 0.1); box-shadow: 0 0 15px rgba(178, 148, 94, 0.2); }
    </style>
</head>
<body class="blueprint-dot min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="p-5 flex justify-between items-center sticky top-0 z-50 bg-stone-50/90 backdrop-blur-md border-b border-stone-200">
        <a href="https://liveadaptiv.com" class="flex items-center gap-3 hover:opacity-70 transition-opacity">
            <div class="w-8 h-8 border border-[#b2945e]/40 rounded-full flex items-center justify-center">
                <span class="font-serif italic text-lg text-[#b2945e] pb-0.5">A</span>
            </div>
            <span class="text-[9px] font-bold uppercase tracking-[0.4em] text-stone-400">LiveAdaptiv</span>
        </a>
        <div class="text-[9px] font-bold uppercase tracking-widest text-[#b2945e] flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-[#b2945e] animate-pulse"></span> Diagnostic
        </div>
    </nav>

    <main class="flex-1 max-w-2xl mx-auto w-full p-6 pb-24 flex flex-col justify-center">
        <!-- Dynamic Content Container -->
        <div id="app-container">
            <!-- Content injected by JS -->
        </div>
    </main>

    <script>
        lucide.createIcons();

        // --- APP STATE ---
        let currentStep = -1; 
        let score = 0;
        let selectedOption = null;

        const questions = [
            { 
                q: "Reaction to Friction", 
                desc: "When a major deadline shifts or a client cancels, what is your immediate default response?",
                options: [
                    { text: "I feel like a victim. 'Why does this always happen to me?'", val: 1 }, 
                    { text: "I get angry and have to fight to fix it immediately.", val: 2 }, 
                    { text: "I look for the opportunity or lesson hidden in the shift.", val: 5 }
                ] 
            },
            { 
                q: "Inner Monologue", 
                desc: "When you are working quietly by yourself, what does the voice in your head sound like?",
                options: [
                    { text: "Highly critical. Pointing out where I am failing or falling behind.", val: 1 }, 
                    { text: "Competitive. Focusing on how to beat the competition or prove myself.", val: 2 }, 
                    { text: "Curious and expansive. Thinking about what I can create next.", val: 5 }
                ] 
            },
            { 
                q: "Motivation Source", 
                desc: "What is the primary fuel driving your work and ambition right now?",
                options: [
                    { text: "Fear. I am avoiding failure, poverty, or letting people down.", val: 1 }, 
                    { text: "Ego. I need to achieve the next level to prove my worth.", val: 2 }, 
                    { text: "Purpose. I want to build something meaningful and expressive.", val: 6 }
                ] 
            },
            { 
                q: "View of Others", 
                desc: "When dealing with subordinates, colleagues, or vendors, how do you primarily view them?",
                options: [
                    { text: "As obstacles or people who just don't 'get it'.", val: 2 }, 
                    { text: "As people doing their best, even if I have to fix their mistakes.", val: 4 }, 
                    { text: "As true partners and co-creators in the vision.", val: 6 }
                ] 
            },
            { 
                q: "Energy at 3 PM", 
                desc: "How does your physical and mental bandwidth feel in the mid-afternoon?",
                options: [
                    { text: "Completely drained, foggy, and relying heavily on caffeine.", val: 1 }, 
                    { text: "Wired, anxious, and physically tense.", val: 2 }, 
                    { text: "Steady, calm, and capable of sustained focus.", val: 5 }
                ] 
            },
            { 
                q: "Goal Driver", 
                desc: "When you set a massive 12-month goal, what is the core reason?",
                options: [
                    { text: "To escape my current situation.", val: 1 }, 
                    { text: "To hit the revenue metric or acquire the title.", val: 2 }, 
                    { text: "To experience my highest potential in real time.", val: 6 }
                ] 
            }
        ];

        // --- DYNAMIC ROUTING ENGINE ---
        function getResultData(avgScore) {
            if (avgScore <= 2.5) {
                // TIER 3: BURNOUT RESCUE
                return {
                    title: "Catabolic Friction",
                    subtitle: "Critical Burnout Risk",
                    desc: "Your current operating system is running on catabolic energy—fueled by conflict, fear, or a need to prove yourself. You are biologically drained and fighting the current.",
                    action: "You need immediate biological stabilization before you can focus on high-level growth. You need the Burnout Rescue Workbook.",
                    upsellTitle: "The Burnout Rescue Workbook",
                    upsellDesc: "A targeted tactical manual to stop the bleeding, restore your sleep architecture, and recover your baseline bandwidth.",
                    upsellLink: "https://billing.liveadaptiv.com/checkout/buy/aab07394-9db6-46d1-8972-60038742f1b7",
                    btnText: "Acquire The Rescue Workbook"
                };
            } else if (avgScore <= 4.5) {
                // TIER 2: STRESS TRANSFORMATION
                return {
                    title: "Transitional Energy",
                    subtitle: "Coping / Rationalization",
                    desc: "You are currently running a hybrid operating system. You cope well with stress, but you are likely tolerating more friction than you realize. You are surviving the current, but not directing it.",
                    action: "To move from 'coping' to sovereignty, you must identify your hidden energy leaks. The Stress Transformation Protocol is your next step.",
                    upsellTitle: "The Stress Transformation Protocol",
                    upsellDesc: "Learn how to convert biological anxiety and friction into actionable, anabolic fuel for your career.",
                    upsellLink: "https://billing.liveadaptiv.com/checkout/buy/d29e3b81-78a4-4611-83f8-11fe76d9d82e",
                    btnText: "Acquire The Protocol"
                };
            } else {
                // TIER 1: ALCHEMIST FIELD GUIDE
                return {
                    title: "Anabolic Sovereignty",
                    subtitle: "High Flow / Low Resistance",
                    desc: "You are operating at a high level of anabolic energy. You view challenges as raw material, you create rather than react, and your motivation is driven by purpose.",
                    action: "To lock in this frequency and scale it across your entire life, utilize the advanced frameworks inside The Alchemist Field Guide.",
                    upsellTitle: "The Alchemist Field Guide",
                    upsellDesc: "The ultimate manual for overriding autonomic panic and rewiring your cognitive baseline. Master your sovereign energy.",
                    upsellLink: "https://billing.liveadaptiv.com/checkout/buy/670a3228-4463-41a4-8520-54bddffcf5d1",
                    btnText: "Acquire The Field Guide"
                };
            }
        }

        // --- RENDER ENGINE ---
        function renderApp() {
            const container = document.getElementById('app-container');
            container.classList.remove('slide-in-right');
            void container.offsetWidth; 

            if (currentStep === -1) {
                // INTRO SCREEN
                container.innerHTML = `
                    <div class="text-center space-y-8 mt-12 fade-in">
                        <span class="text-xs font-bold tracking-[0.3em] uppercase text-[#b2945e] border border-[#b2945e] px-3 py-1 rounded-full">Diagnostic</span>
                        <h1 class="text-5xl md:text-6xl font-serif italic text-stone-900 leading-tight">The Kinetic<br>Audit.</h1>
                        <div class="w-16 h-1 bg-[#b2945e] mx-auto"></div>
                        <p class="text-lg text-stone-600 font-serif leading-relaxed max-w-xl mx-auto">
                            Identify your invisible energy leaks. This 6-question clinical diagnostic maps the exact nature of the friction in your life.
                        </p>
                        <button onclick="nextStep()" class="mt-8 bg-stone-900 text-white px-10 py-4 rounded-full font-sans text-xs font-bold tracking-[0.2em] uppercase shadow-lg hover:bg-[#b2945e] transition-all transform hover:-translate-y-1">
                            Begin Audit
                        </button>
                    </div>
                `;
            } else if (currentStep >= 0 && currentStep < questions.length) {
                // QUESTION SCREEN
                const q = questions[currentStep];
                let optionsHtml = '';
                q.options.forEach((opt, idx) => {
                    optionsHtml += `
                        <button onclick="selectOption(${opt.val})" class="w-full text-left p-6 rounded-2xl bg-white option-btn mb-4 group relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-1 bg-[#b2945e] opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <span class="font-sans text-sm text-stone-700 leading-relaxed block pl-2">${opt.text}</span>
                        </button>
                    `;
                });

                const progress = ((currentStep + 1) / questions.length) * 100;

                container.innerHTML = `
                    <div class="slide-in-right">
                        <!-- Progress Bar -->
                        <div class="mb-8">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[9px] font-bold uppercase tracking-widest text-stone-400">Phase 0${currentStep + 1} of 06</span>
                            </div>
                            <div class="w-full h-1 bg-stone-200 rounded-full overflow-hidden">
                                <div class="h-full bg-[#b2945e] transition-all duration-500" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <h2 class="text-3xl font-serif italic text-stone-900 mb-3">${q.q}</h2>
                        <p class="text-sm text-stone-500 mb-8 max-w-md">${q.desc}</p>
                        
                        <div class="space-y-2">
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            } else {
                // RESULTS & DYNAMIC UPSELL
                const avgScore = score / questions.length;
                const result = getResultData(avgScore);
                const isCatabolic = avgScore <= 3.5;

                container.innerHTML = `
                    <div class="fade-in">
                        <div class="text-center mb-10">
                            <span class="text-[10px] font-bold uppercase tracking-widest text-stone-400 block mb-2">Audit Complete</span>
                            <h2 class="text-4xl font-serif italic text-stone-900 mb-2">Your Profile: <br><span class="text-[#b2945e]">${result.title}</span></h2>
                        </div>

                        <div class="bg-white p-8 rounded-[24px] border border-stone-200 shadow-xl mb-10 relative overflow-hidden">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-[#b2945e] opacity-5 rounded-full blur-2xl transform translate-x-10 -translate-y-10"></div>
                            <div class="flex items-center gap-3 mb-6">
                                <i data-lucide="${isCatabolic ? 'alert-circle' : 'zap'}" class="w-6 h-6 text-[#b2945e]"></i>
                                <h3 class="font-sans text-xs font-bold uppercase tracking-widest text-stone-900">${result.subtitle}</h3>
                            </div>
                            <p class="text-stone-600 font-serif text-lg leading-relaxed mb-6">
                                ${result.desc}
                            </p>
                            <div class="p-4 bg-stone-50 border border-stone-100 rounded-xl">
                                <p class="text-xs text-stone-500 font-bold uppercase tracking-widest mb-1">Clinical Recommendation</p>
                                <p class="text-sm text-stone-800 italic font-serif">"${result.action}"</p>
                            </div>
                        </div>

                        <!-- DYNAMIC UPSELL LAYER -->
                        <div class="bg-stone-900 rounded-[24px] p-8 text-center shadow-2xl border border-stone-800 relative overflow-hidden group">
                            <div class="absolute inset-0 bg-[#b2945e] opacity-0 group-hover:opacity-5 transition-opacity duration-500"></div>
                            <h3 class="font-serif italic text-3xl text-white mb-3">${result.upsellTitle}</h3>
                            <p class="text-sm text-stone-400 mb-8 max-w-sm mx-auto leading-relaxed">
                                ${result.upsellDesc}
                            </p>
                            
                            <!-- DYNAMIC LEMON SQUEEZY CHECKOUT LINK -->
                            <a href="${result.upsellLink}" target="_blank" class="inline-block w-full py-4 rounded-full bg-[#b2945e] text-white font-bold text-[10px] uppercase tracking-[0.2em] hover:bg-[#d97706] transition-colors shadow-[0_0_20px_rgba(178,148,94,0.3)]">
                                ${result.btnText}
                            </a>
                            
                            <p class="text-[9px] text-stone-500 uppercase tracking-widest mt-4">Secure Checkout via LiveAdaptiv</p>
                        </div>
                        
                        <div class="text-center mt-8">
                            <a href="https://liveadaptiv.com" class="text-[10px] font-bold uppercase tracking-widest text-stone-400 hover:text-stone-900 transition-colors">
                                &larr; Return to Hub
                            </a>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            }

            container.classList.add('slide-in-right');
        }

        function selectOption(val) {
            selectedOption = val;
            score += val;
            nextStep();
        }

        function nextStep() {
            currentStep++;
            selectedOption = null;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize App
        renderApp();

    </script>
</body>
</html>
