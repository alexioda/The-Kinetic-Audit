<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kinetic Audit | LiveAdaptiv</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #b2945e; --stone: #fafaf9; --charcoal: #1c1917; }
        body { background-color: var(--stone); color: var(--charcoal); font-family: 'Inter', sans-serif; overscroll-behavior: none; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .blueprint-dot { background-image: radial-gradient(circle at 1px 1px, #e7e5e4 1px, transparent 0); background-size: 30px 30px; }
        
        .fade-in { animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-in-right { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideInRight { 0% { opacity: 0; transform: translateX(20px); } 100% { opacity: 1; transform: translateX(0); } }

        .option-btn { transition: all 0.2s ease; border: 1px solid #e7e5e4; }
        .option-btn:hover { border-color: var(--gold); background-color: rgba(178, 148, 94, 0.05); }
    </style>
</head>
<body class="blueprint-dot min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="p-5 flex justify-between items-center sticky top-0 z-50 bg-stone-50/90 backdrop-blur-md border-b border-stone-200">
        <a href="https://liveadaptiv.com" class="flex items-center gap-3 hover:opacity-70 transition-opacity">
            <div class="w-8 h-8 border border-[#b2945e]/40 rounded-full flex items-center justify-center">
                <span class="font-serif italic text-lg text-[#b2945e] pb-0.5">A</span>
            </div>
            <span class="text-[9px] font-bold uppercase tracking-[0.4em] text-stone-400">LiveAdaptiv</span>
        </a>
        <div class="text-[9px] font-bold uppercase tracking-widest text-[#b2945e] flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-[#b2945e] animate-pulse"></span> Diagnostic Active
        </div>
    </nav>

    <main class="flex-1 max-w-2xl mx-auto w-full p-6 pb-24 flex flex-col justify-center">
        <!-- Dynamic Content Container -->
        <div id="app-container">
            <!-- Content injected by JS -->
        </div>
    </main>

    <footer class="text-center pb-8 mt-auto">
        <p class="text-[10px] text-stone-400 uppercase tracking-widest font-bold">&copy; 2026 LiveAdaptiv Systems</p>
    </footer>

    <script>
        lucide.createIcons();

        // --- APP STATE ---
        let currentStep = -1; 
        let totalScore = 0;

        // 10-Question Clinical Audit Data
        const questions = [
            { text: "When I wake up, my first thought regarding the day ahead is usually:", options: [ { text: "Energized or neutral.", value: 0 }, { text: "Mildly annoyed but manageable.", value: 1 }, { text: "A heavy sense of dread or exhaustion.", value: 2 }, { text: "Complete apathy; I am emotionally numb.", value: 3 } ] },
            { text: "When a minor inconvenience occurs (e.g., an email, a dropped pen, a small delay):", options: [ { text: "I handle it easily.", value: 0 }, { text: "I get briefly frustrated.", value: 1 }, { text: "I feel a disproportionate spike of rage/panic.", value: 2 }, { text: "I feel nothing. I am too tired to care.", value: 3 } ] },
            { text: "Regarding my empathy toward clients, patients, or team members:", options: [ { text: "I remain compassionate and engaged.", value: 0 }, { text: "I have to fake it occasionally.", value: 1 }, { text: "I view them as obstacles or burdens.", value: 2 }, { text: "I feel profound cynicism and detachment.", value: 3 } ] },
            { text: "My sleep architecture right now is:", options: [ { text: "Solid. I wake up rested.", value: 0 }, { text: "Inconsistent, but I survive.", value: 1 }, { text: "I can't fall asleep because my mind races.", value: 2 }, { text: "I sleep, but wake up completely exhausted.", value: 3 } ] },
            { text: "When I am not working, my brain is:", options: [ { text: "Present and engaged in my life.", value: 0 }, { text: "Thinking about work occasionally.", value: 1 }, { text: "Constantly looping over worst-case scenarios.", value: 2 }, { text: "Completely checked out / doomscrolling for hours.", value: 3 } ] },
            { text: "Physically, my body feels:", options: [ { text: "Healthy and regulated.", value: 0 }, { text: "A bit tense, maybe minor headaches.", value: 1 }, { text: "Chronically tight (jaw, shoulders, chest).", value: 2 }, { text: "Heavy, exhausted, or experiencing chronic pain.", value: 3 } ] },
            { text: "If my supervisor/system asked me to take on one more task right now:", options: [ { text: "I could handle it.", value: 0 }, { text: "I'd do it, but I'd be resentful.", value: 1 }, { text: "I would panic or snap at them.", value: 2 }, { text: "I would mentally or physically collapse.", value: 3 } ] },
            { text: "My reliance on substances (caffeine, alcohol, sugar) to change my state is:", options: [ { text: "Minimal or zero.", value: 0 }, { text: "Normal/Average.", value: 1 }, { text: "Increasing. I need them to function/relax.", value: 2 }, { text: "Absolute. I am dependent on them to regulate.", value: 3 } ] },
            { text: "When I think about my professional future:", options: [ { text: "I see growth and opportunity.", value: 0 }, { text: "I'm just trying to get through the week.", value: 1 }, { text: "I want to escape but feel trapped.", value: 2 }, { text: "I believe my career/industry has ruined me.", value: 3 } ] },
            { text: "Which statement best describes your current state?", options: [ { text: "I am managing my friction well.", value: 0 }, { text: "I am stressed, but still fighting.", value: 1 }, { text: "I am surviving on pure adrenaline.", value: 2 }, { text: "I am running on empty. I am broken.", value: 3 } ] }
        ];

        // --- DYNAMIC ROUTING ENGINE ---
        function getResultData(percentScore) {
            if (percentScore >= 66) {
                // TIER 1: HIGH BANDWIDTH
                return {
                    title: "High Cognitive Bandwidth",
                    subtitle: "Optimized / Low Resistance",
                    icon: "shield-check",
                    desc: "Your nervous system is currently regulated. You have the cognitive bandwidth required to build indestructible enterprise architecture. Now is the time to fortify your boundaries before the environment degrades your reserves.",
                    action: "Scale your capacity and execute under pressure with The Alchemist Field Guide.",
                    upsellTitle: "The Alchemist Field Guide",
                    upsellDesc: "The ultimate manual for overriding autonomic panic and rewiring your cognitive baseline. Master your sovereign energy.",
                    upsellLink: "https://billing.liveadaptiv.com/checkout/buy/670a3228-4463-41a4-8520-54bddffcf5d1",
                    btnText: "Acquire The Field Guide"
                };
            } else if (percentScore >= 33) {
                // TIER 2: MODERATE DEBT
                return {
                    title: "Moderate Autonomic Debt",
                    subtitle: "Sympathetic Response / Coping",
                    icon: "zap",
                    desc: "You are operating in a chronic state of 'Fight or Flight.' Your amygdala is actively dumping cortisol, resulting in high anxiety, disrupted sleep, and reactivity. You need structural tools to metabolize this stress before you enter collapse.",
                    action: "Learn to convert biological anxiety and friction into actionable, anabolic fuel.",
                    upsellTitle: "The Stress Transformation Protocol",
                    upsellDesc: "A targeted framework to interrupt the cortisol loop, reframe your narrative, and reclaim your bandwidth.",
                    upsellLink: "https://billing.liveadaptiv.com/checkout/buy/d29e3b81-78a4-4611-83f8-11fe76d9d82e",
                    btnText: "Acquire The Protocol"
                };
            } else {
                // TIER 3: CRITICAL BURNOUT
                return {
                    title: "Critical Burnout Risk",
                    subtitle: "Dorsal Vagal Shutdown",
                    icon: "alert-triangle",
                    desc: "Diagnostic Critical. You are exhibiting signs of severe Autonomic Collapse. You do not have the bandwidth for a complex masterclass right now. You need an immediate, frictionless lifeline to stop the psychological bleed.",
                    action: "You need immediate biological stabilization before you can focus on high-level growth.",
                    upsellTitle: "The Burnout Rescue Workbook",
                    upsellDesc: "A targeted tactical manual to stop the bleeding, restore your sleep architecture, and recover your baseline bandwidth.",
                    upsellLink: "https://billing.liveadaptiv.com/checkout/buy/aab07394-9db6-46d1-8972-60038742f1b7",
                    btnText: "Acquire The Rescue Workbook"
                };
            }
        }

        // --- RENDER ENGINE ---
        function renderApp() {
            const container = document.getElementById('app-container');
            container.classList.remove('slide-in-right');
            void container.offsetWidth; 

            if (currentStep === -1) {
                // INTRO SCREEN
                container.innerHTML = `
                    <div class="text-center space-y-8 mt-12 fade-in">
                        <span class="text-xs font-bold tracking-[0.3em] uppercase text-[#b2945e] border border-[#b2945e] px-3 py-1 rounded-full">Diagnostic</span>
                        <h1 class="text-5xl md:text-6xl font-serif italic text-stone-900 leading-tight">The Kinetic<br>Audit.</h1>
                        <div class="w-16 h-1 bg-[#b2945e] mx-auto"></div>
                        <p class="text-lg text-stone-600 font-serif leading-relaxed max-w-xl mx-auto">
                            Identify your invisible energy leaks. This 10-question clinical diagnostic maps the exact nature of the friction in your life. Answer instinctively.
                        </p>
                        <button onclick="nextStep()" class="mt-8 bg-stone-900 text-white px-10 py-4 rounded-full font-sans text-xs font-bold tracking-[0.2em] uppercase shadow-lg hover:bg-[#b2945e] transition-all transform hover:-translate-y-1">
                            Begin Audit
                        </button>
                    </div>
                `;
            } else if (currentStep >= 0 && currentStep < questions.length) {
                // QUESTION SCREEN
                const q = questions[currentStep];
                let optionsHtml = '';
                q.options.forEach((opt) => {
                    optionsHtml += `
                        <button onclick="handleSelection(${opt.value})" class="w-full text-left p-6 rounded-2xl bg-white option-btn mb-4 group relative overflow-hidden">
                            <div class="absolute left-0 top-0 bottom-0 w-1 bg-[#b2945e] opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <span class="font-sans text-sm text-stone-700 leading-relaxed block pl-2">${opt.text}</span>
                        </button>
                    `;
                });

                const progress = ((currentStep + 1) / questions.length) * 100;

                container.innerHTML = `
                    <div class="slide-in-right">
                        <!-- Progress Bar -->
                        <div class="mb-8">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[9px] font-bold uppercase tracking-widest text-stone-400">Question ${currentStep + 1 > 9 ? currentStep + 1 : '0' + (currentStep + 1)} of 10</span>
                                <span class="text-[9px] font-bold uppercase tracking-widest text-[#b2945e]">${Math.round(progress)}%</span>
                            </div>
                            <div class="w-full h-1.5 bg-stone-200 rounded-full overflow-hidden">
                                <div class="h-full bg-[#b2945e] transition-all duration-500" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <h2 class="text-2xl md:text-3xl font-serif italic text-stone-900 mb-8 leading-snug">${q.text}</h2>
                        
                        <div class="space-y-2">
                            ${optionsHtml}
                        </div>
                    </div>
                `;
            } else {
                // RESULTS & DYNAMIC UPSELL
                // Calculate percentage: 0 raw friction = 100% capacity, 30 raw friction = 0% capacity
                let percentScore = Math.round(((30 - totalScore) / 30) * 100);
                const result = getResultData(percentScore);

                container.innerHTML = `
                    <div class="fade-in">
                        <div class="text-center mb-10">
                            <span class="text-[10px] font-bold uppercase tracking-widest text-stone-400 block mb-2">Diagnostic Complete</span>
                            <div class="text-6xl font-serif italic text-stone-900 mb-2">${percentScore}<span class="text-3xl text-stone-500">%</span></div>
                            <p class="text-xs font-bold uppercase tracking-widest text-[#b2945e]">Kinetic Bandwidth Score</p>
                        </div>

                        <div class="bg-white p-8 rounded-[24px] border border-stone-200 shadow-xl mb-10 relative overflow-hidden">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-[#b2945e] opacity-5 rounded-full blur-2xl transform translate-x-10 -translate-y-10"></div>
                            <div class="flex items-center gap-3 mb-6">
                                <i data-lucide="${result.icon}" class="w-6 h-6 text-[#b2945e]"></i>
                                <h3 class="font-sans text-xs font-bold uppercase tracking-widest text-stone-900">${result.title}</h3>
                            </div>
                            <p class="text-stone-600 font-serif text-lg leading-relaxed mb-6">
                                ${result.desc}
                            </p>
                            <div class="p-4 bg-stone-50 border border-stone-100 rounded-xl">
                                <p class="text-xs text-stone-500 font-bold uppercase tracking-widest mb-1">Clinical Recommendation</p>
                                <p class="text-sm text-stone-800 italic font-serif">"${result.action}"</p>
                            </div>
                        </div>

                        <!-- DYNAMIC UPSELL LAYER -->
                        <div class="bg-stone-900 rounded-[24px] p-8 text-center shadow-2xl border border-stone-800 relative overflow-hidden group">
                            <div class="absolute inset-0 bg-[#b2945e] opacity-0 group-hover:opacity-5 transition-opacity duration-500"></div>
                            <h3 class="font-serif italic text-3xl text-white mb-3">${result.upsellTitle}</h3>
                            <p class="text-sm text-stone-400 mb-8 max-w-sm mx-auto leading-relaxed">
                                ${result.upsellDesc}
                            </p>
                            
                            <a href="${result.upsellLink}" target="_blank" class="inline-block w-full py-4 rounded-full bg-[#b2945e] text-white font-bold text-[10px] uppercase tracking-[0.2em] hover:bg-[#d97706] transition-colors shadow-[0_0_20px_rgba(178,148,94,0.3)] relative z-10">
                                ${result.btnText}
                            </a>
                            
                            <p class="text-[9px] text-stone-500 uppercase tracking-widest mt-4 relative z-10">Secure Checkout via LiveAdaptiv</p>
                        </div>
                        
                        <div class="text-center mt-8">
                            <a href="https://liveadaptiv.com" class="text-[10px] font-bold uppercase tracking-widest text-stone-400 hover:text-stone-900 transition-colors">
                                &larr; Return to Hub
                            </a>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            }

            container.classList.add('slide-in-right');
        }

        function handleSelection(val) {
            totalScore += val;
            setTimeout(() => {
                nextStep();
            }, 300); // Small delay so they see the click
        }

        function nextStep() {
            currentStep++;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize App
        renderApp();

    </script>
</body>
</html>
